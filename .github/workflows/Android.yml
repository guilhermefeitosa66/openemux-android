# The only workflow of this fork (see .github/CI.md). It checks the OpenEmux
# Android app: its JVM unit tests and lint, plus a compile check of the native
# engine when a change can reach it. It builds no APK: the beta and release
# APKs are built locally by the maintainer, on purpose.
#
# The name "CI Android" is read by the OpenEmux pipeline's CI gate; keep it.
name: CI Android

on:
  pull_request:
    branches: [openemux-mobile]
  push:
    branches: [openemux-mobile]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NDK_VERSION: 28.2.13676358

jobs:
  # Upstream RetroArch ships ~100 workflows; a sync from upstream/master brings
  # new ones back. Anything here that is not on the allowlist turns this red.
  workflows:
    name: Workflow allowlist
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@v5
      with:
        sparse-checkout: .github
    - name: Only the allowed workflows exist
      run: |
        allowed="Android.yml"
        extra=$(ls -A .github/workflows | grep -vxF "$allowed" || true)
        if [ -n "$extra" ]; then
          echo "::error::Workflows outside the allowlist: $(echo $extra)"
          echo "This fork runs only CI Android. Delete these files (an upstream"
          echo "sync brought them back) or add them to the allowlist; see .github/CI.md."
          exit 1
        fi
        echo "ok: only $allowed"

  app:
    name: Unit tests and lint
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v5

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'gradle'
        cache-dependency-path: |
          pkg/android/openemux/*.gradle.kts
          pkg/android/openemux/gradle/wrapper/gradle-wrapper.properties

    - name: testDebugUnitTest and lintDebug
      working-directory: pkg/android/openemux
      run: |
        # A repository that answers with a server error is retried with
        # a backoff (2 s doubling, six tries) before Gradle gives up on
        # it for the rest of the build. A build that still fails to fetch
        # a dependency is run again, keeping what it already fetched and
        # built; any other failure fails the step at once.
        set -o pipefail
        for i in 1 2 3; do
          ./gradlew --no-daemon testDebugUnitTest lintDebug \
            -Dorg.gradle.internal.repository.max.tentatives=6 \
            -Dorg.gradle.internal.repository.initial.backoff=2000 \
            2>&1 | tee gradle.log && break
          grep -qE 'Could not (resolve|GET|HEAD|download)' gradle.log \
            && [ $i != 3 ] || exit 1
          echo "dependency fetch failed (attempt $i); retrying in 30s"
          sleep 30
        done
        tests=$(cat build/test-results/testDebugUnitTest/*.xml \
          | grep -o '<testsuite [^>]*tests="[0-9]*"' | grep -o 'tests="[0-9]*"' \
          | tr -dc '0-9\n' | awk '{ n += $1 } END { print n + 0 }')
        echo "unit tests run: $tests"
        echo "Unit tests run: **$tests**" >> "$GITHUB_STEP_SUMMARY"

    - name: Upload test and lint reports
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: app-reports
        path: |
          pkg/android/openemux/build/reports/
          pkg/android/openemux/build/test-results/
        if-no-files-found: ignore

  # Compile check of the RetroArch engine (libretroarch-activity.so) with the
  # OpenEmux hooks. The library is not packaged anywhere: it only has to build.
  engine:
    name: Engine compile check
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      pull-requests: read
    steps:
    - name: Does the change reach the engine?
      id: scope
      env:
        GH_TOKEN: ${{ github.token }}
        PR: ${{ github.event.pull_request.number }}
      run: |
        # Pushes and manual runs always compile. A pull request compiles only
        # when it touches something outside the Kotlin app.
        if [ "${{ github.event_name }}" != pull_request ]; then
          echo "build=true" >> "$GITHUB_OUTPUT"; exit 0
        fi
        files=$(gh api --paginate "repos/${{ github.repository }}/pulls/$PR/files" --jq '.[].filename')
        outside=$(printf '%s\n' "$files" | grep -v '^pkg/android/openemux/' || true)
        if [ -n "$outside" ]; then
          echo "build=true" >> "$GITHUB_OUTPUT"
          echo "engine compile: the PR touches files outside pkg/android/openemux/"
        else
          echo "build=false" >> "$GITHUB_OUTPUT"
          echo "engine compile skipped: Kotlin-only change" | tee -a "$GITHUB_STEP_SUMMARY"
        fi

    - uses: actions/checkout@v5
      if: steps.scope.outputs.build == 'true'

    - name: Install NDK and ccache
      if: steps.scope.outputs.build == 'true'
      run: |
        sudo apt-get update -qq && sudo apt-get install -y -qq ccache
        yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION" > /dev/null
        echo "NDK=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

    - name: Restore ccache
      if: steps.scope.outputs.build == 'true'
      uses: actions/cache@v4
      with:
        path: ~/.cache/ccache
        key: engine-ccache-${{ env.NDK_VERSION }}-${{ github.sha }}
        restore-keys: engine-ccache-${{ env.NDK_VERSION }}-

    - name: ndk-build arm64-v8a
      if: steps.scope.outputs.build == 'true'
      working-directory: pkg/android/phoenix-common
      env:
        CCACHE_MAXSIZE: 500M
      run: |
        export CCACHE_DIR=$HOME/.cache/ccache
        ccache -z
        "$NDK/ndk-build" NDK_CCACHE=ccache APP_ABI=arm64-v8a -j"$(nproc)"
        ls -l libs/arm64-v8a/libretroarch-activity.so
        ccache -s
