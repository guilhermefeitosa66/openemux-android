<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>OpenEmux controller skin</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="{{rootStyle}}">
<sc-for list="{{parts}}" as="p" hint-placeholder-count="40">
<div style="{{p.style}}">
<sc-if value="{{p.hasIcon}}" hint-placeholder-val="{{ false }}">
<svg viewBox="0 0 24 24" style="{{p.iconStyle}}" aria-hidden="true"><path d="{{p.icon}}" fill="{{p.iconFill}}" stroke="{{p.iconStroke}}" stroke-width="{{p.iconWidth}}" stroke-linecap="round" stroke-linejoin="round"></path></svg>
</sc-if>
<sc-if value="{{p.hasLabel}}" hint-placeholder-val="{{ false }}">
<span style="{{p.labelStyle}}">{{p.label}}</span>
</sc-if>
</div>
</sc-for>
</div>
</x-dc>

const OE = (() => {

  const mix = (a, b, t) => { const x = hex(a), y = hex(b); return toHex(x[0] + (y[0] - x[0]) * t, x[1] + (y[1] - x[1]) * t, x[2] + (y[2] - x[2]) * t); };
  const lighten = (c, t) => mix(c, '#ffffff', t);
  const darken = (c, t) => mix(c, '#000000', t);
  const alpha = (c, a) => { const x = hex(c); return `rgba(${x[0]},${x[1]},${x[2]},${a})`; };
  const r1 = (v) => Math.round(v * 10) / 10;

  const ICON = {

  // Colors measured on photos of each console's best-known shell (Wikimedia Commons, Evan-Amos).

    },
    SFC: {
      name: 'SNES', res: '256 × 224', aspect: 4 / 3, body: '#CDCDCD', bezel: '#55555B', bar: '#A9A9AB', barIcon: '#3E3E44',
      dpad: '#2E2E33', dpadMark: '#6A6A72', faceWell: '#BDBDC0', shoulder: '#A9A9AB', shoulderInk: '#4A4A50', pill: '#8A8A92',

      shoulders: [[{ input: 'l', label: 'L' }], [{ input: 'r', label: 'R' }]], center: SELECT_START,

    N64: {

      dpad: '#B9B8BA', dpadMark: '#6E6D70', shoulder: '#B9B8BA', shoulderInk: '#2A2A2D', pill: '#E23B2E', labelInk: '#A8A8AE', brandInk: '#A8A8AE',
      leftMain: 'stick', stick: { knob: '#C7C5C6' },
      face: { kind: 'n64', colors: { a: '#2D5DB5', b: '#1F8E50', c: '#F2C21B' }, inks: { a: '#FFFFFF', b: '#FFFFFF', c: '#6A4F00' } },
      shoulders: [[{ input: 'l', label: 'L' }], [{ input: 'r', label: 'R' }]],
      secondary: [{ pos: 'left', kind: 'dpad' }], center: [{ input: 'start', label: 'START' }],
    },
    GC: {
      name: 'GameCube', res: '640 × 480', aspect: 4 / 3, body: '#514988', bezel: '#26223F', bar: '#3A3468', barIcon: '#CFCAEE',
      dpad: '#8F8BB0', dpadMark: '#4A4480', shoulder: '#8F8BB0', shoulderInk: '#26223F', pill: '#9C98B8', labelInk: '#CFCAEE', brandInk: '#CFCAEE',
      leftMain: 'stick', stick: { knob: '#B9B7C6' },
      face: { kind: 'gc', colors: { a: '#12B378', b: '#E8383F', x: '#BDBAD0', y: '#BDBAD0' }, inks: { a: '#FFFFFF', b: '#FFFFFF', x: '#4A4280', y: '#4A4280' } },
      shoulders: [[{ input: 'l', label: 'L' }], [{ input: 'z', label: 'Z' }, { input: 'r', label: 'R' }]],
      secondary: [{ pos: 'left', kind: 'dpad' }, { pos: 'right', kind: 'stick', right: true, knob: '#F4D400', label: 'C', ink: '#6A5A00', size: 80 }],

    GB: {
      name: 'Game Boy', res: '160 × 144', aspect: 10 / 9, body: '#C3C0BB', bezel: '#5E5C66', bar: '#A19D97', barIcon: '#3D3B40',

      face: { kind: 'diamond', color: '#5A585B', map: {
        top: { input: 'x', symbol: 'tri' }, left: { input: 'y', symbol: 'square' }, right: { input: 'a', symbol: 'circle' }, bottom: { input: 'b', symbol: 'cross' } } },
      shoulders: [[{ input: 'l2', label: 'L2' }, { input: 'l1', label: 'L1' }], [{ input: 'r1', label: 'R1' }, { input: 'r2', label: 'R2' }]],

        top: { input: 'x', symbol: 'tri' }, left: { input: 'y', symbol: 'square' }, right: { input: 'a', symbol: 'circle' }, bottom: { input: 'b', symbol: 'cross' } } },

  // Issue 770: the consoles bundled in OpenEmux's own skin format (tools/skins/build.py, OWN_FORMAT). Where the hardware

  Object.assign(C, {

  // The official colour variants (issue 720): per console, the retail colours the console (or, for the home
  // consoles, the controller the skin depicts) was sold in, in the order the app lists them. Each one changes
  // colours only: the layout reads the same palette keys, so frames, screens and knobs match the console's own

    // Jet Black, Platinum and Spice; the skin's own colours are Indigo.

      black: { label: 'Black', body: '#1E1E22', controls: '#3A3A40', pill: '#55555C' },
      silver: { label: 'Silver', body: '#B8BAC0', controls: '#9C9EA6', pill: '#8A8C94' },
      orange: { label: 'Orange', body: '#EE8A22', controls: '#D97A18', pill: '#F2C08A' },
    },
    // Ceramic White, Silver and Metallic Blue; the skin's own colours are Piano Black.
    PSP: {
      white: { label: 'White', body: '#F0F0EE', controls: '#E2E2E0', face: { color: '#E6E6E4', symColor: '#7A7C82' } },
      silver: { label: 'Silver', body: '#BFC3C8', controls: '#AEB2B8', face: { color: '#B4B8BE', symColor: '#4E5056' } },
      blue: { label: 'Blue', body: '#34548F', controls: '#2C4A80', face: { color: '#2E4C84', symColor: '#C4D0E6' } },
    },
  };

  /** How light [c] is, 0 to 1 (relative luminance). */
  function luma(c) {
    const lin = (v) => { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); };
    const x = hex(c).map(lin);
    return 0.2126 * x[0] + 0.7152 * x[1] + 0.0722 * x[2];
  }

  /** The console's palette [S] in the colour variant [v]: the shell, the inks that read on it, and [v]'s keys. */
  function colorPalette(S, v) {
    const light = luma(v.body) > 0.3;
    const ink = v.ink || (light ? darken(v.body, 0.62) : lighten(v.body, 0.75));
    const own = Object.assign({}, v);
    ['label', 'body', 'controls', 'ink', 'face'].forEach((k) => delete own[k]);
    const out = Object.assign({}, S, {
      body: v.body, translucent: !!v.translucent, gloss: S.gloss,
      bar: darken(v.body, 0.16), barIcon: ink, labelInk: ink, brandInk: ink,
      shoulder: S.shoulder && darken(v.body, 0.12), shoulderInk: S.shoulderInk && ink,
    });
    if (v.controls) {
      const mark = luma(v.controls) > 0.3 ? darken(v.controls, 0.4) : lighten(v.controls, 0.35);
      Object.assign(out, {
        dpad: v.controls, dpadMark: mark, shoulder: S.shoulder && v.controls, shoulderInk: S.shoulderInk && mark,
        stick: S.stick && Object.assign({}, S.stick, { knob: lighten(v.controls, 0.12) }),
      });
      // The N64's Z is moulded in the controller's plastic.
      if (S.face.kind === 'n64') out.face = Object.assign({}, S.face, { colors: Object.assign({}, S.face.colors, { z: v.controls }), inks: Object.assign({}, S.face.inks, { z: mark }) });
    }
    Object.assign(out, own);
    if (v.face) {
      const f = out.face || S.face;
      const map = f.map && v.face.map && Object.fromEntries(Object.entries(f.map).map(([k, b]) => [k, Object.assign({}, b, v.face.map[k])]));
      out.face = Object.assign({}, f, v.face, {
        colors: (f.colors || v.face.colors) && Object.assign({}, f.colors, v.face.colors),
        inks: (f.inks || v.face.inks) && Object.assign({}, f.inks, v.face.inks),
        map: map || f.map,
      });
    }
    return out;
  }

  /** The variants [id] comes in, in the order the app lists them: its own colours, Dark, then its official colours. */
  function variants(id) {
    return VARIANTS.concat(Object.keys(COLORS[id] || {}));
  }

  /** The console's palette in [variant] ('console', the default, 'dark' or one of its COLORS). */
  function palette(id, variant) {
    if (!variant || variant === 'console') return C[id];
    if (variant === 'dark') return darkPalette(C[id]);
    const v = COLORS[id] && COLORS[id][variant];
    if (!v) throw new Error(`unknown variant: ${variant}`);
    return colorPalette(C[id], v);
  }

  /** The two colours the app's picker shows for [variant]: the shell and its main buttons. */
  function swatch(id, variant) {
    const S = palette(id, variant), f = S.face;
    const key = f.color || (f.colors && f.colors.a) || (f.map && f.map.right && f.map.right.color) || S.dpad;
    return { body: S.body, key };
  }

  // Face clusters: offsets from the cluster's centre, in units at scale 1.
  const FACE = {
    // [labels] names the two buttons where the console calls them otherwise (the PC Engine's II and I, the Game Gear's 1 and 2).
    ab: (f) => [{ input: 'b', label: (f.labels || {}).b || 'B', dx: -36, dy: 18, w: 62 }, { input: 'a', label: (f.labels || {}).a || 'A', dx: 36, dy: -18, w: 62 }],
    nes: (f) => [{ input: 'b', label: (f.labels || {}).b || 'B', dx: -38, dy: 0, w: 60 }, { input: 'a', label: (f.labels || {}).a || 'A', dx: 38, dy: 0, w: 60 }],
    // As tall as the d-pad: the top button lines up with its up arm, the bottom one with its down arm.
    diamond: (f) => [['top', 0, -47], ['left', -47, 0], ['right', 47, 0], ['bottom', 0, 47]]
      .map(([pos, dx, dy]) => Object.assign({ dx, dy, w: 46 }, f.map[pos])),
    md: () => [
      { input: 'x', label: 'X', dx: -50, dy: -19, w: 38 }, { input: 'y', label: 'Y', dx: 0, dy: -33, w: 38 }, { input: 'z', label: 'Z', dx: 50, dy: -47, w: 38 },
      { input: 'a', label: 'A', dx: -58, dy: 39, w: 52 }, { input: 'b', label: 'B', dx: 0, dy: 25, w: 52 }, { input: 'c', label: 'C', dx: 58, dy: 11, w: 52 }],
    sms: () => [{ input: 'b', label: '1', dx: -38, dy: 6, w: 60, shape: 'square' }, { input: 'a', label: '2', dx: 38, dy: -6, w: 60, shape: 'square' }],
    n64: () => [
      { input: 'cUp', dx: 36, dy: -70, w: 34, c: true, arrow: 0 }, { input: 'cLeft', dx: 0, dy: -36, w: 34, c: true, arrow: 270 },
      { input: 'cRight', dx: 72, dy: -36, w: 34, c: true, arrow: 90 }, { input: 'cDown', dx: 36, dy: -2, w: 34, c: true, arrow: 180 },
      // A, B and Z in a triangle under the C buttons, Z in the controller's grey.
      { input: 'b', label: 'B', dx: -82, dy: 0, w: 54 }, { input: 'a', label: 'A', dx: -24, dy: 46, w: 58 },
      { input: 'z', label: 'Z', dx: -84, dy: 62, w: 44, color: '#B9B8BA', ink: '#2A2A2D' }],
    gc: () => [
      { input: 'a', label: 'A', dx: 0, dy: 13, w: 74 }, { input: 'b', label: 'B', dx: -62, dy: 51, w: 42 },
      { input: 'x', label: 'X', dx: 62, dy: -7, w: 34, h: 62, shape: 'pill', rot: -18 },
      { input: 'y', label: 'Y', dx: -14, dy: -55, w: 62, h: 34, shape: 'pill', rot: -18 }],
  };

  // The D-pad's circle, in fractions of the D-pad's size (as the app's drawn skins: 44 and 14 of its 120 units):
  // its centre travels half the square, its edge stops at the arm tips.
  const DPAD_KNOB = { travel: 44 / 120, radius: 14 / 120, stroke: 2 / 120, image: 'dpad_knob.png' };

  // The circle centred on its travel square, which the image covers (the overlay stretches it over that square).
  function knobParts(S, d, size) {
    const side = 2 * size * DPAD_KNOB.travel, w = size * DPAD_KNOB.stroke;
    return [{ style: `display:flex;align-items:center;justify-content:center;` +
      `background:radial-gradient(circle at 50% 50%, ${alpha(S.dpadMark, 0.7)} 0 ${r1(d / 2 - w)}px, ${S.dpadMark} ${r1(d / 2 - w)}px ${r1(d / 2)}px, transparent ${r1(d / 2 + 0.3)}px);` +
      `filter:drop-shadow(0 ${r1(side * 0.017)}px ${r1(side * 0.017)}px rgba(0,0,0,.25));` }];
  }

  /** The circle alone, its travel square [side] units wide, for the package's knob image. */
  function dpadKnob(id, side, variant) {
    const size = side / (2 * DPAD_KNOB.travel);
    const parts = knobParts(palette(id, variant), size * DPAD_KNOB.radius * 2, size).map((k) => Object.assign({ hasLabel: false, hasIcon: false },
      { style: `position:absolute;left:0;top:0;width:${side}px;height:${side}px;box-sizing:border-box;` + k.style }));
    return { W: side, H: side, parts };
  }

  function layout(id, device, orient, opts) {
    opts = opts || {};
    const S = palette(id, opts.variant);
    // A fold is an unfolded foldable's inner screen (604 x 726 units, 1812 x 2178 px at 3 px a unit: about a Galaxy Z
    // Fold's 1812 x 2176): the tablet's spacing on a squarer page, so the picture takes a phone's share of it and the
    // side columns are narrower.
    const fold = device === 'fold', tab = device === 'tablet' || fold, port = orient === 'portrait';
    const W = fold ? (port ? 604 : 726) : tab ? (port ? 800 : 1280) : (port ? 360 : 746);
    const H = fold ? (port ? 726 : 604) : tab ? (port ? 1280 : 800) : (port ? 746 : 360);
    const parts = [], items = [], screens = [], knobs = [];
    // [owner]: the index of the item the parts being added belong to (null: the background's); [act]: a quick action's.
    let owner = null, act = false;
    const own = () => { owner = items.length; };
    const add = (style, extra) => { parts.push(Object.assign({ style, hasLabel: false, hasIcon: false, label: '', labelStyle: '', icon: '', iconStyle: '', iconFill: 'none', iconStroke: 'none', iconWidth: 0, el: owner, act }, extra || {})); };
    const box = (x, y, w, h) => `position:absolute;left:${x}px;top:${y}px;width:${w}px;height:${h}px;box-sizing:border-box;`;
    const center = 'display:flex;align-items:center;justify-content:center;';
    const lbl = (label, ink, size, spacing) => ({ hasLabel: true, label, labelStyle: `font:700 ${r1(size)}px/1 'Space Grotesk',sans-serif;letter-spacing:${spacing || '.04em'};color:${ink};white-space:nowrap` });
    const item = (inputs, x, y, w, h, ext, thumbstick) => items.push({ inputs, frame: { x: r1(x), y: r1(y), width: r1(w), height: r1(h) }, extendedEdges: ext, thumbstick });
    // How the last item looks, for the OpenEmux-format templates (build.py --templates): its group, label, shape and
    // colour parts. The Delta packages leave it out.
    const look = (l) => { items[items.length - 1].look = l; };
    const icon = (d, stroke, size, fill, width) => ({ hasIcon: true, icon: d, iconStroke: stroke, iconFill: fill || 'none', iconWidth: width == null ? 1.8 : width, iconStyle: `width:${size}px;height:${size}px;display:block` });

    // Body: matte plastic, lit from above; translucent and glossy shells get their own sheen.
    let bg = `radial-gradient(120% 70% at 50% 0%, ${lighten(S.body, 0.1)} 0%, ${S.body} 55%, ${darken(S.body, 0.1)} 100%)`;
    if (S.translucent) bg = `repeating-linear-gradient(45deg, ${alpha('#ffffff', 0.05)} 0 2px, transparent 2px 9px), linear-gradient(160deg, ${lighten(S.body, 0.2)} 0%, ${S.body} 45%, ${darken(S.body, 0.14)} 100%)`;
    if (S.dark) bg = `radial-gradient(120% 70% at 50% 0%, ${lighten(S.body, 0.03)} 0%, ${S.body} 60%)`;
    if (S.gloss) bg = `linear-gradient(165deg, ${lighten(S.body, 0.16)} 0%, ${S.body} 30%, ${S.body} 70%, ${lighten(S.body, 0.06)} 100%)`;
    add(box(0, 0, W, H) + `background:repeating-linear-gradient(0deg, ${alpha('#ffffff', 0.012)} 0 1px, transparent 1px 3px), ${bg};`);

    // The game's screen(s), as large as the room allows, in a thin bezel. The quick actions sit in the
    // bezel's chin, right under the picture, like a TV's buttons under its screen.
    // Two screens touch: DeSmuME draws them with no gap, so the bezel's opening matches the picture exactly.
    // The NDS has one art per screen layout (opts.screens: 'top', 'bottom', 'stacked', 'side'; 'stacked' when not
    // given): the bezel holds the screens the layout shows, one, two in a column or two in a row, as large as the
    // controls allow, so a single screen is not drawn in a frame made for two.
    const nds = S.screens === 2, shown = nds ? (opts.screens || 'stacked') : null;
    const rows = shown === 'stacked' ? 2 : 1, cols = shown === 'side' ? 2 : 1;
    const m = tab ? 16 : 6, pad = tab ? 10 : 6;
    const chin = tab ? 44 : (port ? 30 : 28);
    let sw, sh;
    if (port) {
      const maxW = W - 2 * m - 2 * pad;
      const maxH = H * (rows === 2 ? (fold ? 0.5 : tab ? 0.6 : 0.56) : (fold ? 0.4 : tab ? 0.5 : 0.42));
      sw = maxW / cols; sh = sw / S.aspect;
      if (rows * sh > maxH) { sh = maxH / rows; sw = sh * S.aspect; }
    } else {
      const minSide = fold ? 190 : tab ? 240 : 150;
      const maxH = H - 2 * m - pad - chin;
      const maxW = W - 2 * minSide - 2 * pad;
      sh = maxH / rows; sw = sh * S.aspect;
      if (cols * sw > maxW) { sw = maxW / cols; sh = sw / S.aspect; }
    }
    const bw = cols * sw + 2 * pad, bh = rows * sh + pad + chin;
    const bx = (W - bw) / 2;
    const by = port ? m : (H - bh) / 2;
    add(box(bx, by, bw, bh) + `border-radius:${tab ? 16 : 10}px;background:${S.bezel};box-shadow:inset 0 1px 0 ${alpha('#ffffff', 0.06)}, 0 1px 0 ${alpha('#ffffff', S.dark ? 0.05 : 0.2)};`);
    for (let i = 0; i < rows * cols; i++) {
      const sx = bx + pad + (i % cols) * sw, sy = by + pad + Math.floor(i / cols) * sh;
      screens.push({ x: r1(sx), y: r1(sy), width: r1(sw), height: r1(sh) });
      add(box(sx, sy, sw, sh) + center + `border-radius:2px;background:#0B0C0E;`,
        opts.export ? {} : lbl(S.res, 'rgba(255,255,255,.28)', tab ? 14 : 11, '.12em'));
    }

    // The chin: save, load, turbo, fast forward, and on the NDS the screens key (its input is the app's own name,
    // which steps to the next layout's art; other emulators ignore it).
    const barY = by + pad + rows * sh, barH = chin;
    const acts = [['quickSave', 'save'], ['quickLoad', 'load'], ['turbo', 'turbo'], ['toggleFastForward', 'ff']]
      .concat(nds ? [['screens', 'screens']] : []);
    const slot = bw / acts.length;
    acts.forEach(([input, ic], i) => {
      // Edges rounded once, so neighbouring slots meet without overlapping.
      const x = r1(bx + slot * i), x1 = r1(bx + slot * (i + 1));
      own(); act = true;
      add(box(x, barY, x1 - x, barH) + center, icon(ICON[ic], S.chinIcon || alpha('#ffffff', 0.7), tab ? 22 : 17));
      item([input], x, barY, x1 - x, barH);
      owner = null; act = false;
      look({ group: 'actions' });
    });

    function shoulders(y, h, l0, l1, r0, r1) {
      const draw = (list, x0, x1, left) => {
        if (!list.length) return;
        const g = 8, w = Math.min(tab ? 170 : 124, (x1 - x0 - g * (list.length - 1)) / list.length);
        list.forEach((s, i) => {
          const x = left ? x0 + i * (w + g) : x1 - (list.length - i) * (w + g) + g;
          const rad = left ? `${h / 2}px ${h / 3}px ${h / 3}px ${h / 3}px` : `${h / 3}px ${h / 2}px ${h / 3}px ${h / 3}px`;
          own();
          add(box(x, y, w, h) + center + `border-radius:${rad};background:linear-gradient(180deg, ${lighten(S.shoulder, 0.12)}, ${darken(S.shoulder, 0.08)});box-shadow:0 3px 0 ${darken(S.shoulder, 0.35)}, 0 6px 10px rgba(0,0,0,.25);`,
            lbl(s.label, S.shoulderInk, tab ? 16 : 13));
          item([s.input], x, y, w, h, left ? { top: 10, left: 12 } : { top: 10, right: 12 });
          owner = null;
          look({ group: left ? 'shoulders-left' : 'shoulders-right', label: s.label, shape: 'rect', colors: { button: S.shoulder, letter: S.shoulderInk } });
        });
      };
      draw(S.shoulders[0], l0, l1, true);
      draw(S.shoulders[1], r0, r1, false);
    }

    function menuBtn(x, y, w, h) {
      own();
      add(box(x, y, w, h) + center + `border-radius:${h / 2}px;background:${S.bar};box-shadow:inset 0 1px 0 ${alpha('#ffffff', 0.08)};`, icon(ICON.menu, S.barIcon, tab ? 22 : 18, 'none', 2));
      item(['menu'], x, y, w, h);
      owner = null;
      look({ group: 'menu', label: 'MENU', shape: 'pill', colors: { button: S.bar, letter: S.barIcon } });
    }

    function dpad(cx, cy, size) {
      const t = size * 0.34, x0 = cx - size / 2, y0 = cy - size / 2, c = S.dpad;
      own();
      // The relief goes under the whole cross: both arms' edges first, then both faces over them,
      // so no edge shows across the middle.
      const rad = `border-radius:${t * 0.22}px;`;
      const edge = rad + `background:${darken(c, 0.45)};box-shadow:0 8px 14px rgba(0,0,0,.3);`;
      add(box(cx - t / 2, y0 + 4, t, size) + edge);
      add(box(x0, cy - t / 2 + 4, size, t) + edge);
      const face = rad + `background:${lighten(c, 0.05)};`;
      add(box(cx - t / 2, y0, t, size) + face);
      add(box(x0, cy - t / 2, size, t) + face);
      const a = t * 0.36;
      [[cx, y0 + t * 0.55, 0], [cx, y0 + size - t * 0.55, 180], [x0 + t * 0.55, cy, 270], [x0 + size - t * 0.55, cy, 90]].forEach(([mx, my, rot]) => {
        add(box(mx - a / 2, my - a / 2, a, a) + `transform:rotate(${rot}deg);`, icon(ICON.arrow, 'none', a, S.dpadMark, 0));
      });
      // No hub on the centre: the circle the app moves with the thumb sits there, an image of its own
      // (dpadKnob above). The canvas draws it at rest, the package only names it.
      const travel = size * DPAD_KNOB.travel;
      if (!opts.export) knobParts(S, size * DPAD_KNOB.radius * 2, size).forEach((k) => add(box(cx - travel, cy - travel, 2 * travel, 2 * travel) + k.style));
      item({ up: 'up', down: 'down', left: 'left', right: 'right' }, x0, y0, size, size, { top: 12, bottom: 12, left: 12, right: 12 });
      owner = null;
      items[items.length - 1].knob = DPAD_KNOB.image;
      look({ group: 'dpad', colors: { pad: S.dpad, ball: S.dpadMark } });
    }

    // The knob is not painted into the art: it is an image of its own (the item's thumbstick), the size of
    // its travel, which the app moves with the thumb. The well is what stays in the art.
    const TRAVEL = 0.65;
    function stick(cx, cy, size, st, right) {
      const x = cx - size / 2, y = cy - size / 2;
      own();
      add(box(x, y, size, size) + `border-radius:50%;background:radial-gradient(circle at 50% 40%, ${darken(S.well || S.body, 0.34)}, ${darken(S.well || S.body, 0.2)} 72%);box-shadow:inset 0 3px 7px rgba(0,0,0,.45), 0 1px 0 ${alpha('#ffffff', S.dark ? 0.04 : 0.18)};`);
      // Half the well wide, its shadow inside the margin the travel leaves around it.
      const r = size / 2, ks = r, kc = st.knob, side = r1(2 * r * TRAVEL);
      const knob = (ox, oy) => box(ox + (side - ks) / 2, oy + (side - ks) / 2, ks, ks) + center + `border-radius:50%;background:radial-gradient(circle at 40% 35%, ${lighten(kc, 0.25)}, ${kc} 60%, ${darken(kc, 0.2)});box-shadow:0 ${r1(r * 0.05)}px ${r1(r * 0.09)}px rgba(0,0,0,.4), inset 0 0 0 ${ks * 0.08}px ${alpha(darken(kc, 0.25), 0.35)};`;
      const label = st.label ? lbl(st.label, st.ink || '#333333', ks * 0.34) : {};
      const name = `knob${knobs.length}.png`;
      knobs.push({ name, size: side, parts: [Object.assign({ style: knob(0, 0), hasIcon: false, hasLabel: false, label: '', labelStyle: '' }, label)] });
      // The canvas shows the knob at rest; the exported art leaves it out.
      if (!opts.export) add(knob(cx - side / 2, cy - side / 2), label);
      item(right ? RIGHT_STICK : LEFT_STICK, x, y, size, size, undefined, { name, width: side, height: side });
      owner = null;
      look({ group: right ? 'stick2' : 'stick', label: st.label, colors: { base: darken(S.well || S.body, 0.27), knob: kc } });
    }

    function button(b, cx, cy, k) {
      const f = S.face;
      const key = b.c ? 'c' : b.input;
      // The Dark variant paints every button in its own grey, the ones the cluster colours itself (N64's Z) too.
      // A colour variant's cluster colours win over the button's own (the N64's Z in a coloured controller's plastic).
      const c = (f.colors && f.colors[key]) || (!S.dark && b.color) || f.color;
      const ink = (f.inks && f.inks[key]) || (!S.dark && b.ink) || f.ink || '#FFFFFF';
      const w = b.w * k, h = (b.h || b.w) * k, x = cx + b.dx * k - w / 2, y = cy + b.dy * k - h / 2;
      const radius = b.shape === 'square' ? `${Math.min(w, h) * 0.24}px` : (b.shape === 'pill' ? `${Math.min(w, h) / 2}px` : '50%');
      let style = box(x, y, w, h) + center + (b.rot ? `transform:rotate(${b.rot}deg);` : '') +
        `border-radius:${radius};background:radial-gradient(circle at 38% 30%, ${lighten(c, 0.22)} 0%, ${c} 55%, ${darken(c, 0.14)} 100%);box-shadow:0 ${r1(3 * k)}px 0 ${darken(c, 0.42)}, 0 ${r1(7 * k)}px ${r1(12 * k)}px rgba(0,0,0,.32);`;
      let extra = {};
      if (b.symbol) extra = icon(ICON[b.symbol], f.symColor || PS_SYM[b.symbol], r1(Math.min(w, h) * 0.52), 'none', 2.2);
      else if (b.arrow != null) { extra = icon(ICON.arrow, 'none', r1(w * 0.46), ink, 0); extra.iconStyle += `;transform:rotate(${b.arrow}deg)`; }
      else if (b.label && S.labelPos !== 'below') extra = lbl(b.label, ink, Math.max(11, Math.min(w, h) * 0.36));
      own();
      add(style, extra);
      owner = null;
      if (b.label && S.labelPos === 'below') add(box(x - 10, y + h + 6 * k, w + 20, 16 * k) + center, lbl(b.label, S.labelInk, 14 * k));
      item([b.input], x, y, w, h);
      const text = b.symbol ? { tri: '△', circle: '○', cross: '✕', square: '□' }[b.symbol]
        : (b.arrow != null ? { 0: '▲', 90: '▶', 180: '▼', 270: '◀' }[b.arrow] : b.label);
      look({ group: 'face', label: text, shape: b.shape === 'square' ? 'rect' : (b.shape || 'circle'), colors: { button: c, letter: ink } });
    }

    /** [room] is the width the face buttons may take: they shrink to it and centre on [rx] by their own extent. */
    function main(lx, rx, cy, k, room) {
      const btns = FACE[S.face.kind](S.face);
      const ext = (b) => Math.max(b.w, b.h || b.w) / 2;
      const minX = Math.min(...btns.map((b) => b.dx - ext(b))), maxX = Math.max(...btns.map((b) => b.dx + ext(b)));
      const kf = Math.min(k, room / (maxX - minX));
      const fx = Math.min(rx - ((minX + maxX) / 2) * kf, W - 8 - maxX * kf);
      if (S.faceWell) { const s = 168 * kf; add(box(fx - s / 2, cy - s / 2, s, s) + `border-radius:50%;background:${S.faceWell};box-shadow:inset 0 2px 6px rgba(0,0,0,.18);`); }
      if (S.leftMain === 'stick') stick(lx, cy, 112 * k, S.stick, false);
      else dpad(lx, cy, 140 * k);
      btns.forEach((b) => button(b, fx, cy, kf));
    }

    function secondary(lx, rx, cy, k) {
      (S.secondary || []).forEach((s) => {
        const x = s.pos === 'left' ? lx : rx;
        if (s.kind === 'dpad') dpad(x, cy, 100 * k);
        else stick(x, cy, (s.size || 92) * k, s, !!s.right);
      });
    }

    function centerKey(c, cx, cy) {
      const w = tab ? 66 : 54, h = tab ? 22 : 18;
      own();
      add(box(cx - w / 2, cy - h / 2, w, h) + `border-radius:${h / 2}px;background:linear-gradient(180deg, ${lighten(S.pill, 0.12)}, ${S.pill});box-shadow:0 2px 0 ${darken(S.pill, 0.4)};` + (S.pillRot ? `transform:rotate(${S.pillRot}deg);` : ''));
      owner = null;
      add(box(cx - 50, cy + h / 2 + 7, 100, 14) + center, lbl(c.label, S.centerInk || S.labelInk, tab ? 12 : 10, '.14em'));
      item([c.input], cx - w / 2, cy - h / 2, w, h, { top: 8, bottom: 18, left: 8, right: 8 });
      look({ group: 'center', label: c.label, shape: 'pill', colors: { button: S.pill, letter: S.centerInk || S.labelInk } });
    }

    function brand(cx, cy) {
      add(box(cx - 80, cy - 8, 160, 16) + center, lbl('OpenEmux', alpha(S.brandInk, 0.42), tab ? 13 : 11, '.32em'));
    }

    const hasSec = !!(S.secondary && S.secondary.length);
    if (port) {
      const y0 = by + bh + (tab ? 24 : 10);
      const shH = tab ? 48 : 40;
      if (S.stripe) add(box(0, y0 - 8, W, 3) + `background:${S.stripe};`);
      shoulders(y0, shH, 12, W / 2 - 36, W / 2 + 36, W - 12);
      menuBtn(W / 2 - 26, y0 + 3, 52, shH - 6);
      const reserve = tab ? 140 : 80;
      const aTop = y0 + shH + 12, aBot = H - reserve;
      if (S.panel) add(box(12, aTop - 4, W - 24, H - aTop - (tab ? 70 : 40)) + `border-radius:${tab ? 26 : 18}px;background:${S.panel};box-shadow:inset 0 2px 0 ${alpha('#ffffff', 0.05)}, 0 1px 0 ${alpha('#ffffff', 0.5)};`);
      const k = Math.min(tab ? 1.12 : 1, (aBot - aTop) / (hasSec ? 290 : 170));
      const lx = tab ? 160 : 90, rx = W - (tab ? 160 : 96);
      main(lx, rx, hasSec ? aTop + (aBot - aTop) * 0.36 : aTop + (aBot - aTop) * 0.42, k, W / 2 + 10);
      if (hasSec) secondary(lx, rx, aTop + (aBot - aTop) * 0.82, k);
      const cyKeys = H - reserve + (tab ? 44 : 22);
      const step = tab ? 120 : 92;
      S.center.forEach((c, i) => centerKey(c, W / 2 + (i - (S.center.length - 1) / 2) * step, cyKeys));
      brand(W / 2, H - (tab ? 40 : 16));
    } else {
      const side = bx, lx = side / 2, rx = W - side / 2;
      const shH = tab ? 48 : 38;
      if (S.stripe) add(box(0, H - 7, W, 3) + `background:${S.stripe};`);
      shoulders(12, shH, 12, side - 12, W - side + 12, W - 12);
      const mY = 12 + shH + 10, mH = tab ? 40 : 30;
      menuBtn(lx - 26, mY, 52, mH);
      brand(rx, mY + mH / 2);
      const top = mY + mH + 10, bot = H - (tab ? 70 : 52);
      const k = (tab ? 1.12 : 0.86) * (hasSec && !tab ? 0.88 : 1);
      main(lx, rx, hasSec ? top + (bot - top) * 0.33 : (top + bot) / 2, k, side - 16);
      if (hasSec) secondary(lx, rx, top + (bot - top) * 0.82, k);
      const cyKeys = H - (tab ? 40 : 30);
      const half = Math.ceil(S.center.length / 2);
      const gap = (tab ? 66 : 54) + 14;
      S.center.forEach((c, i) => {
        const leftSide = S.center.length === 1 ? false : i < half;
        // The keys on the left end at side - 44 and step left, on the right start at W - side + 44 and step right.
        const nth = leftSide ? half - 1 - i : i - (S.center.length === 1 ? 0 : half);
        centerKey(c, leftSide ? side - 44 - nth * gap : W - side + 44 + nth * gap, cyKeys);
      });
    }

    // The bezel and the page's colours, for the templates too.
    const frame = { x: r1(bx), y: r1(by), width: r1(bw), height: r1(bh) };
    const colors = { body: S.body, bezel: S.bezel, icons: S.chinIcon || alpha('#ffffff', 0.7) };
    return { W, H, parts, items, screens, knobs, name: S.name, aspect: S.aspect, frame, colors };
  }

  return { layout, dpadKnob, palette, variants, swatch, DPAD_KNOB, C, DARK, VARIANTS, COLORS };
})();
// ENGINE END

class Component extends DCLogic {
  renderVals() {
    const id = this.props.console ?? 'GBA';
    const device = this.props.device ?? 'phone';
    const orient = this.props.orient ?? 'portrait';
    // A colour the console was not sold in shows its own colours.
    const variant = OE.variants(id).includes(this.props.variant) ? this.props.variant : 'console';
    const L = OE.layout(id, device, orient, { screens: this.props.screens, variant });
    let parts = L.parts;
    if (this.props.showTouch) {
      const touch = L.items.map((it) => {
        const e = it.extendedEdges || {};
        const x = it.frame.x - (e.left || 0), y = it.frame.y - (e.top || 0);
        const w = it.frame.width + (e.left || 0) + (e.right || 0), h = it.frame.height + (e.top || 0) + (e.bottom || 0);
        return { style: `position:absolute;left:${x}px;top:${y}px;width:${w}px;height:${h}px;box-sizing:border-box;border:1.5px dashed #00E5FF;background:rgba(0,229,255,.08);`, hasLabel: false, hasIcon: false };
      });
      parts = parts.concat(touch);
    }
    const rootStyle = `position:relative;width:${L.W}px;height:${L.H}px;overflow:hidden;font-family:'Space Grotesk',sans-serif;background:#000;`;
    return { parts, rootStyle };
  }
}
